services:
  # PostgreSQL 16 com extensão pgvector pré-instalada
  db:
    image: pgvector/pgvector:pg16
    container_name: vendas_db
    environment:
      POSTGRES_USER: vendas_user
      POSTGRES_PASSWORD: vendas_password
      POSTGRES_DB: vendas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vendas_user -d vendas_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Backend FastAPI
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: vendas_backend
    environment:
      DATABASE_URL: postgresql://vendas_user:vendas_password@db:5432/vendas_db
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      POSTGRES_HOST: db
      POSTGRES_USER: vendas_user
      POSTGRES_PASSWORD: vendas_password
      POSTGRES_DB: vendas_db
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./dbt_olist:/app/dbt_olist

  # Frontend React (Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: vendas_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # Apache Airflow Standalone / Scheduler & Webserver
  airflow:
    image: apache/airflow:2.9.3-python3.11
    container_name: vendas_airflow
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://vendas_user:vendas_password@db:5432/vendas_db
      AIRFLOW__WEBSERVER__WEB_SERVER_HOST: '0.0.0.0'
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: '8080'
      DATABASE_URL: postgresql://vendas_user:vendas_password@db:5432/vendas_db
      POSTGRES_HOST: db
      POSTGRES_USER: vendas_user
      POSTGRES_PASSWORD: vendas_password
      POSTGRES_DB: vendas_db
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./data:/opt/airflow/data
      - ./dbt_olist:/opt/airflow/dbt_olist
      - ./scripts:/opt/airflow/scripts
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "airflow db init && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@example.com --password admin && airflow standalone"

  # Serviço de Carga e Inicialização Automática de Dados (ETL + dbt + Embeddings)
  init-data:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: vendas_init_data
    environment:
      DATABASE_URL: postgresql://vendas_user:vendas_password@db:5432/vendas_db
      POSTGRES_HOST: db
      POSTGRES_USER: vendas_user
      POSTGRES_PASSWORD: vendas_password
      POSTGRES_DB: vendas_db
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./dbt_olist:/app/dbt_olist
    command: >
      sh -c "
        echo '🚀 Inicializando banco e carregando dados brutos do Olist...' &&
        python scripts/carregar_rapido.py &&
        echo '📊 Executando transformações dbt (Star Schema)...' &&
        cd /app/dbt_olist && dbt run --profiles-dir . && cd /app &&
        echo '🧠 Gerando embeddings vetoriais (pgvector)...' &&
        python -m ai.embed_products &&
        python -m ai.embed_reviews &&
        echo '✅ Carga e inicialização automática finalizadas com sucesso!'
      "

volumes:
  postgres_data:
